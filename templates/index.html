<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏍️ Biker Trip Planner AI</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">
    <h1>🏍️ Biker Trip Planner AI</h1>
    <p class="subtitle">Plan motorcycle routes using AI + OpenStreetMap</p>

    <div class="input-box">
        <input id="start" placeholder="Starting location (e.g., Bangalore)">
        <input id="destination" placeholder="Destination (e.g., Wayanad)">
        <button onclick="generate()">Plan Ride</button>
    </div>

    <div id="error-box" class="error-box"></div>
    <div id="loader" class="loader hidden"></div>

    <!-- MAP -->
    <div id="map" style="height:420px;border-radius:16px;margin-bottom:30px;"></div>

    <div id="output" class="output hidden">
        <div class="card">
            <h2>🛣️ Route Plan</h2>
            <div id="route"></div>
        </div>

        <div class="card highlight">
            <h2>📍 Places to Visit</h2>
            <div id="places"></div>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =====================================================
   MAP INIT
===================================================== */
const map = L.map("map").setView([12.9716, 77.5946], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
}).addTo(map);

let routeLayer;
let startMarker, endMarker;

/* =====================================================
   HELPERS
===================================================== */
async function geocode(place) {
    const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`
    );
    const data = await res.json();
    return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
}

async function drawRoute(start, destination) {
    const startC = await geocode(start);
    const endC = await geocode(destination);

    const url =
        `https://router.project-osrm.org/route/v1/driving/${startC[1]},${startC[0]};${endC[1]},${endC[0]}?overview=full&geometries=geojson`;

    const res = await fetch(url);
    const data = await res.json();

    if (routeLayer) map.removeLayer(routeLayer);
    if (startMarker) map.removeLayer(startMarker);
    if (endMarker) map.removeLayer(endMarker);

    routeLayer = L.geoJSON(data.routes[0].geometry, {
        style: { weight: 5 }
    }).addTo(map);

    startMarker = L.marker(startC).addTo(map).bindPopup("Start");
    endMarker = L.marker(endC).addTo(map).bindPopup("Destination");

    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
}

/* =====================================================
   UI
===================================================== */
function showError(msg) {
    const box = document.getElementById("error-box");
    box.innerText = msg;
    box.style.display = "block";
}

function clearError() {
    document.getElementById("error-box").style.display = "none";
}

function generate() {
    const start = document.getElementById("start").value.trim();
    const destination = document.getElementById("destination").value.trim();
    const loader = document.getElementById("loader");
    const output = document.getElementById("output");

    clearError();

    if (!start || !destination) {
        showError("Please enter both locations");
        return;
    }

    loader.classList.remove("hidden");
    output.classList.add("hidden");

    fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start, destination })
    })
    .then(res => res.json())
    .then(async data => {
        document.getElementById("route").innerHTML = data.route_plan;
        document.getElementById("places").innerHTML = data.places_to_visit;
        await drawRoute(start, destination);
        output.classList.remove("hidden");
    })
    .catch(() => showError("Server error"))
    .finally(() => loader.classList.add("hidden"));
}
</script>

</body>
</html>
